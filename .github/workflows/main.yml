
name: Inspect Blender Android Libraries

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Inspect Android dependency repository
        run: |
          git clone --depth 1 --branch main https://projects.blender.org/blender/blender.git blender
          cd blender
          echo "=== Android submodule entry ==="
          grep -n -A3 -B3 'lib/android_arm64' .gitmodules || true
          echo "=== Android build instructions ==="
          grep -n -i -E 'android_arm64|submodule|dependency' build_files/android/BUILDING.md | head -60
          echo "=== Android library directory ==="
          ls -la lib/android_arm64 2>&1 || true
