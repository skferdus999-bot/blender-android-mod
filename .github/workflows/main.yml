
name: Inspect Blender Android Libraries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"

    steps:
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Clone Android source
        run: |
          git clone --depth 1 --branch android \
            https://github.com/simfeo/blender.git blender

      - name: Inspect Android source and libraries
        run: |
          cd blender

          echo "=== Android build guide ==="
          if [ -f build_files/android/BUILDING.md ]; then
            echo "Build guide found"
          else
            echo "Build guide missing"
          fi

          echo "=== Android library directory ==="
          if [ -d lib/android_arm64 ]; then
            ls -lah lib/android_arm64
          else
            echo "Android library directory missing"
          fi

          echo "=== Git submodule configuration ==="
          git submodule status || true

          echo "=== Git LFS status ==="
          git lfs ls-files | head -n 30 || true

          echo "=== Inspection finished ==="
