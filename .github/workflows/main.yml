
name: Prepare Blender Android Lite

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Clone Blender source
        run: |
          git clone --branch main https://projects.blender.org/blender/blender.git blender
          cd blender
          git lfs pull
          echo "Listing configured submodules:"
          cat .gitmodules
          echo "Initializing available submodules:"
          git submodule update --init --recursive

      - name: Check Android libraries
        run: |
          cd blender
          if [ -d lib/android_arm64 ]; then
            ls -lah lib/android_arm64
          else
            echo "Android library folder is missing."
            exit 1
          fi
