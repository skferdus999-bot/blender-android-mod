
name: Check Blender Android Submodule

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Android library submodule
        run: |
          git ls-remote https://projects.blender.org/blender/blender.git HEAD
          git ls-remote https://projects.blender.org/blender/blender.git refs/heads/main
          git ls-remote https://projects.blender.org/blender/blender.git refs/heads/ios
          echo "Checking Android port repository..."
          git ls-remote https://github.com/Wanderson-Magalhaes/blender_for_android.git HEAD || true
