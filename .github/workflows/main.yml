
name: Inspect Blender Android Libraries

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Clone Android branch
        run: |
          git clone --depth 1 --branch android https://github.com/simfeo/blender.git blender
          cd blender
          git lfs pull
          git submodule update --init --recursive

      - name: Check Android files
        run: |
          cd blender
          echo "=== Android build guide ==="
          ls -l build_files/android/BUILDING.md
          echo "=== Android libraries ==="
          ls -lah lib/android_arm64
          echo "=== Git submodule status ==="
          git submodule status
