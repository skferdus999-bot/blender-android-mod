
name: Prepare Blender Android Lite

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Clone Blender source
        run: |
          git clone --branch main https://projects.blender.org/blender/blender.git blender
          cd blender
          git lfs pull
          git submodule update --init lib/linux_x64 lib/android_arm64

      - name: Check Android dependencies
        run: |
          cd blender
          echo "Checking Android libraries..."
          ls -lah lib/android_arm64
          echo "Checking host libraries..."
          ls -lah lib/linux_x64
