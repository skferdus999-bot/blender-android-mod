
name: Inspect Blender iOS Branch

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Inspect iOS branch
        run: |
          git clone --depth 1 --branch ios https://projects.blender.org/blender/blender.git blender
          cd blender
          echo "=== Android port files ==="
          find intern/ghost/intern -maxdepth 1 -type f \( -name '*Android*' -o -name '*android*' \) | head -60
          echo "=== Android build directory ==="
          ls -la build_files/android 2>&1 || true
          echo "=== Android libraries ==="
          ls -la lib/android_arm64 2>&1 || true
          echo "=== Git submodule configuration ==="
          grep -n -A3 -B3 'lib/android_arm64' .gitmodules || true
